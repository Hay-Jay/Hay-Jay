<style>

.mcv-skip{position:absolute;right:16px;bottom:max(16px,env(safe-area-inset-bottom));min-width:76px;min-height:44px;padding:0 14px;border:1px solid rgba(255,255,255,.45);border-radius:0;background:rgba(0,0,0,.45);color:#eee;font:inherit;text-transform:inherit;letter-spacing:.24em;cursor:pointer}
@keyframes mcv-out{to{opacity:0;visibility:hidden}}
@keyframes mcv-in{from{opacity:0}}
@keyframes mcv-gone{to{opacity:0}}

@keyframes mcv-scan{8%{opacity:1}50%{transform:translateY(62px)}92%{opacity:1}100%{opacity:0;transform:none}}

@keyframes mcv-seal{15%{opacity:1}55%{opacity:.8}100%{opacity:0}}

@keyframes mcv-zoom{0%{transform:none;animation-timing-function:cubic-bezier(.3,0,.6,1)}75%{transform:scale(1.05);animation-timing-function:cubic-bezier(.55,.085,.68,.53)}100%{transform:scale(5)}}

}

</style>
<div class="mcv" id="mcl" aria-hidden="true">

<script>
(function(){

  D=o.querySelector('.mcv-door');
  for(i=1;i<7;i++){x=d.createElement('i');x.className='mcv-k';x.style.setProperty('--z',i);D.prepend(x)}
  for(i=0;i<8;i++){x=d.createElement('i');x.className='mcv-b';x.style.cssText='--a:'+i*45+'deg;--t:'+(1.03+i*.1).toFixed(2)+'s';D.prepend(x)}
  f='<clipPath id="mcvC"><ellipse cx="20" cy="25" rx="15.5" ry="21"/></clipPath><g clip-path="url(#mcvC)" fill="none" stroke="currentColor" stroke-width="1.25">';
  for(i=0;i<11;i++)f+='<ellipse cx="'+(20+i*.15)+'" cy="'+(30-i*.5)+'" rx="'+(1.2+i*2)+'" ry="'+(2+i*2.6)+'" stroke-dasharray="'+(11+i*6)+' 2.2 '+(4+i*3)+' 1.6"/>';
  o.querySelectorAll('.mcv-fp').forEach(function(s){s.innerHTML=f+'</g>'});

  function off(){E.forEach(function(e){removeEventListener(e,skip,true)})}
  function end(){if(done)return;done=1;off();h.classList.remove('mcl-on');o.remove();d.dispatchEvent(new CustomEvent('mcl:done'))}
  function skip(){off();o.style.pointerEvents='none';if(!d.getAnimations)return end();d.getAnimations().forEach(function(a){if(/^mcv/.test(a.animationName)&&R>a.currentTime){a.currentTime=R;a.playbackRate=1.5}})}
  E.forEach(function(e){addEventListener(e,skip,{capture:true,passive:true})});
  o.addEventListener('animationend',function(e){if(e.target==o)end()});
  setTimeout(end,4500);
})();
</script>
