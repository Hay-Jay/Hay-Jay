name: Sync Monochrome products

# Refreshes monochrome-site/data/products.js from the Shopify storefront once a day,
# and commits it when something changed (new product, price, stock, photos).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull products from Shopify
        working-directory: monochrome-site
        run: node scripts/sync-products.mjs
      - name: Commit changes
        run: |
          # syncedAt changes on every run, so compare everything except that line
          if git diff --quiet -I'"syncedAt"' -- monochrome-site/data/products.js; then
            echo "No product changes."
            git checkout -- monochrome-site/data/products.js
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add monochrome-site/data/products.js
            git commit -m "Sync Shopify products"
            git push
          fi
