<style>
/* Layout: a broadcast control room. Console header with tally light, then a rundown of today's posts, channel monitors with goal rings,
   and a week grid. Each channel opens its own bay: links, road-to-monetization meters, a growth chart, and the video library.
   Committed single dark theme: it is a control room. */
:root {
  color-scheme: dark;
  --bg: #0d0c10; --panel: #16151b; --panel-2: #1e1d25; --line: #2c2a35; --ink: #f3efe6; --muted: #a29eac; --faint: #6f6b79;

  --acc: #f3efe6;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px;
  background-image: radial-gradient(1200px 600px at 80% -10%, rgba(255,59,48,.07), transparent 60%), radial-gradient(900px 500px at -10% 30%, rgba(120,110,255,.05), transparent 60%);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.02; text-wrap: balance; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 8px; }
.label { font: 700 11px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* console header */
.console { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: linear-gradient(var(--bg) 70%, rgba(13,12,16,0)); padding-block: 14px 10px; display: grid; gap: 12px; }
.console-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.tally { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border-radius: 6px; border: 1.5px solid currentColor; font: 700 12px var(--mono); letter-spacing: .14em; color: var(--tally); }

.empty { padding: 18px 16px; color: var(--muted); }

/* posted toggles */

.mon-body { padding: 14px; display: grid; gap: 12px; }

/* week grid */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }

/* channel bay */
.banner { position: relative; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(120deg, color-mix(in srgb, var(--acc) 30%, #0d0c10), #121117 70%); }

.vid-body { padding: 12px; display: grid; gap: 10px; }

.ytbanner { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); display: block; }

<script>
const DATA = /*__DATA__*/null;
const BRIGHT = { naija: '#2fd38a', football: '#ff5c78', whatif: '#8f9bff', myth: '#f0c35a', ocean: '#b69cff' };
const GOALS = { tf: ['TikTok followers', 10000], tv: ['TikTok views, last 30 days', 100000], ys: ['YouTube subscribers', 1000], yv: ['YouTube Shorts views, last 90 days', 10000000] };
const DAY_KEYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });
const fmt = n => n == null ? '—' : nf.format(n);
const acc = id => DATA.accounts.find(a => a.id === id);
const col = a => BRIGHT[a.id] || a.color;
let posted = {}, links = {}, stats = {}, setup = {}, db = null, canWrite = true;
const SETUP_STEPS = [['email', 'Make its own Gmail'], ['tiktok', 'Create the TikTok account with the handle'], ['youtube', 'Create the YouTube channel with the handle'], ['pics', 'Add the profile picture on both'], ['banner', 'Upload the YouTube banner'], ['bio', 'Paste the bio and hashtags'], ['links', 'Save its links in this studio', 'auto'], ['first', 'Post the first video', 'auto']];
function stepDone(a, k) {
  if (k === 'links') { const l = links[a.id] || {}; if (l.tiktok && l.youtube) return true; }
  if (k === 'first') { if (a.episodes.some(e => { const p = posted[`${a.id}--${e.id}`] || {}; return p.tiktok || p.youtube; })) return true; }
  return !!((setup[a.id] || {}).done || {})[k];

const TICK = '<svg class="tick" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const RING = '<svg class="ring" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
const PLAY = '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';

function today() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }
function weekStart() { const d = today(); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return d; }
const isDone = (a, e) => { const s = posted[`${a.id}--${e.id}`] || {}; return !!(s.tiktok && s.youtube); };
const nextVideo = a => a.episodes.find(e => !isDone(a, e));
function nextSlot(a) { const d = today(); for (let k = 0; k < 7; k++) { const x = new Date(d); x.setDate(d.getDate() + k); if (a.days.includes(DAY_KEYS[x.getDay()])) return k === 0 ? 'Today' : k === 1 ? 'Tomorrow' : DAY_KEYS[x.getDay()]; } return '—'; }
const latest = id => { const h = (stats[id] && stats[id].history) || []; return h[h.length - 1] || null; };

function postBtns(a, e) {
  return [['tiktok', 'TikTok'], ['youtube', 'YouTube']].map(([p, n]) => `<button class="post" type="button" data-key="${a.id}--${e.id}" data-platform="${p}" aria-pressed="false">${RING}${TICK}<span>${n}</span></button>`).join('');
}
function ring(value, goal, color, label) {
  const pct = value == null ? 0 : Math.min(1, value / goal), r = 26, C = 2 * Math.PI * r;
  return `<div class="ringbox"><svg viewBox="0 0 62 62" role="img" aria-label="${esc(label)}: ${value == null ? 'not logged' : Math.round(pct * 100) + '%'}">
    <circle cx="31" cy="31" r="${r}" fill="none" stroke="#2c2a35" stroke-width="7"/>
    <circle cx="31" cy="31" r="${r}" fill="none" stroke="${pct >= 1 ? '#34d27b' : color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" transform="rotate(-90 31 31)"/>
    <text x="31" y="35" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="12" fill="#f3efe6">${value == null ? '—' : Math.round(pct * 100) + '%'}</text></svg>
    <span class="v"><b>${fmt(value)}</b><span class="label">${esc(label)} / ${fmt(goal)}</span></span></div>`;
}

function chartSvg(a) {
  const h = ((stats[a.id] && stats[a.id].history) || []).slice(-30);
  if (h.length < 2) return `<p class="muted">Log your numbers on two different days to see the growth line here.</p>`;
  const Wd = 640, Hd = 220, pad = 34, max = Math.max(10, ...h.map(e => Math.max(e.tf || 0, e.ys || 0)));
  const x = i => pad + i * (Wd - pad * 2) / (h.length - 1), y = v => Hd - pad - (v / max) * (Hd - pad * 2);
  const line = (k, c) => { const pts = h.map((e, i) => e[k] == null ? null : `${x(i).toFixed(1)},${y(e[k]).toFixed(1)}`).filter(Boolean); return pts.length > 1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>` + (() => { const L = h.length - 1, v = h[L][k]; return v == null ? '' : `<circle cx="${x(L)}" cy="${y(v)}" r="5" fill="${c}"/>`; })() : ''; };
  const grid = [0, 0.5, 1].map(f => `<line x1="${pad}" x2="${Wd - pad}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#2c2a35"/><text x="${pad - 6}" y="${y(max * f) + 4}" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="17" fill="#a29eac">${fmt(Math.round(max * f))}</text>`).join('');
  return `<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Follower growth">${grid}${line('tf', col(a))}${line('ys', '#f3efe6')}
    <text x="${pad}" y="${Hd - 8}" font-family="JetBrains Mono, monospace" font-size="17" fill="#a29eac">${esc(h[0].d)}</text>
    <text x="${Wd - pad}" y="${Hd - 8}" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="17" fill="#a29eac">${esc(h[h.length - 1].d)}</text></svg>
    <div class="legend"><span><i style="background:${col(a)}"></i>TikTok followers</span><span><i style="background:#f3efe6"></i>YouTube subscribers</span></div>`;
}

const vkey = (a, e) => `${a.id}--${e.id}`;
const vlatest = (a, e) => { const h = (vstats[vkey(a, e)] || {}).history || []; return h[h.length - 1] || null; };
const vinfo = (a, e) => vstats[vkey(a, e)] || {};

// Example numbers, shown only until real numbers exist, and always labelled as examples.
function exampleStats(a) {
  const base = [5200, 2100, 3900, 1500, 2600, 1100], d0 = today();
  const out = {};
  orderOf(a).forEach((e, i) => {
    const v = base[i % base.length], hist = [];
    for (let k = 0; k < 4; k++) { const d = new Date(d0); d.setDate(d.getDate() - (9 - k * 3)); const f = [0.35, 0.65, 0.85, 1][k]; hist.push({ d: isoDate(d), views: Math.round(v * f), likes: Math.round(v * f * 0.05), comments: Math.round(v * f * 0.006 * (i % 3 ? 1 : 2.5)), subs: Math.round(v * f * 0.004), stayed: [72, 58, 69, 51, 63, 47][i % 6], avgpct: [88, 71, 84, 62, 76, 55][i % 6] }); }
    const when = new Date(d0); when.setDate(when.getDate() - 10 + i);
    out[vkey(a, e)] = { status: 'published', when: isoDate(when), history: hist };
  });
  return out;
}
function orderOf(a) { const o = a.launch_order || []; return [...a.episodes].sort((x, y) => (o.indexOf(x.id) + 1 || 99) - (o.indexOf(y.id) + 1 || 99)); }
function slotsFrom(a, n) {
  const out = [], d = today();   // today counts: post now, then the next slots
  while (out.length < n) { if (a.days.includes(DAY_KEYS[d.getDay()])) out.push(new Date(d)); d.setDate(d.getDate() + 1); }

  for (const e of a.episodes) { const c = new Set([...normTitle(e.yt_title), ...normTitle(e.title)]); const inter = [...t].filter(w => c.has(w)).length, sc = inter / Math.max(1, Math.min(t.size, c.size)); if (sc > bs) { bs = sc; best = e; } }
  return bs >= 0.5 ? best : null;
}
async function importExport(a, file) {
  let text;
  if (/\.zip$/i.test(file.name) || file.type.includes('zip')) {
    if (!window.JSZip) throw new Error('The ZIP reader didn\'t load. Upload the "Table data.csv" file instead.');
    const zip = await JSZip.loadAsync(file); const f = Object.values(zip.files).find(z => /table data\.csv$/i.test(z.name)) || Object.values(zip.files).find(z => /\.csv$/i.test(z.name));
    if (!f) throw new Error('No CSV inside that ZIP. Export again as "Comma-separated values".');
    text = await f.async('string');
  } else text = await file.text();
  const rows = parseCSV(text.replace(/^﻿/, '')); if (rows.length < 2) throw new Error('That file has no rows.');
  const head = rows[0].map(h => h.trim().toLowerCase());
  const col = (...res) => head.findIndex(h => res.some(r => r.test(h)));
  const C = { title: col(/^video title$/, /title/), views: col(/^views$/), likes: col(/^likes$/, /^likes /), comments: col(/comments/), subs: col(/^subscribers$/, /subscribers gained/), stayed: col(/stayed to watch/, /swiped/), avgpct: col(/average percentage viewed/), when: col(/publish time/, /published/) };
  if (C.title < 0 || C.views < 0) throw new Error('Couldn\'t find "Video title" and "Views" columns. Export the Content tab from Advanced mode.');
  const num = v => { const n = parseFloat(String(v || '').replace(/[,%\s]/g, '')); return isNaN(n) ? null : n; };
  const d = isoDate(today()); let ok = 0; const missed = [];
  for (const r of rows.slice(1)) {
    const title = r[C.title]; if (!title || /^total$/i.test(title.trim())) continue;
    const e = matchEpisode(a, title); if (!e) { missed.push(title); continue; }
    const k = vkey(a, e), cur = vstats[k] || {};
    const entry = { d, views: num(r[C.views]) || 0 };
    for (const f of ['likes', 'comments', 'subs', 'stayed', 'avgpct']) if (C[f] >= 0) { const v = num(r[C[f]]); if (v != null) entry[f] = v; }
    const hist = (cur.history || []).filter(x => x.d !== d).concat([entry]).slice(-200);
    let when = cur.when || ''; if (C.when >= 0 && r[C.when]) { const pd = new Date(r[C.when]); if (!isNaN(pd)) when = isoDate(pd); }
    const next = { ...cur, status: 'published', when, history: hist };
    await db.collection('vstats').doc(k).set(next); vstats = { ...vstats, [k]: next }; ok++;
    const p = posted[k] || {}; if (!p.youtube) { const np = { tiktok: !!p.tiktok, youtube: true, updatedAt: new Date().toISOString() }; await db.collection('posted').doc(k).set(np); posted = { ...posted, [k]: np }; }
  }
  return { ok, missed };
}
async function askClaude(a) {
  const m = analyticsModel(a);
  const sample = await claude.use('sample');
  if (!sample) { claudeRead = { text: '', busy: false, err: 'Asking Claude isn\'t available in this view.' }; render(); return; }
  claudeRead = { text: '', busy: true, err: '' }; render();
  const data = m.rows.map(r => ({ title: r.e.title, topic: (r.e.tags || {}).topic, hook: (r.e.tags || {}).hook, endsWithQuestion: !!(r.e.tags || {}).ask, seconds: r.e.seconds, published: r.info.when || null, status: r.info.status || 'uploaded', latest: r.l || null }));
  const prompt = `You are a YouTube Shorts coach. The channel "${a.brand_name || a.label}" posts 30-40 second animated Nigerian history Shorts in an Ankara pop-art style, hosted by Ijapa the tortoise, on ${a.days.join(', ')}.
Here is each video with its latest YouTube numbers (views; stayed = % who stayed to watch instead of swiping away; avgpct = average % of the video viewed; subs = subscribers gained):
${JSON.stringify(data)}
Subscribers now: ${m.subsNow ?? 'unknown'}.
Write a short, plain-English review for the creator, under 220 words, with these four headings on their own lines: What worked, What didn't, Make next (3 specific Nigerian history video ideas that fit what worked), This week (2 concrete actions). Only use the numbers given; if there is too little data, say so. No markdown symbols other than "- " for list items.`;
  try {
    const res = await sample(prompt, { onText: ({ text }) => { claudeRead.text = text; const el = document.getElementById('claude-read'); if (el) el.textContent = text; }, cache: false });
    claudeRead = { text: res.text, busy: false, err: '' };
  } catch (e) { claudeRead = { text: '', busy: false, err: e && e.code === 'rate_limited' ? 'Too many requests just now. Try again in a minute.' : e && e.code === 'not_granted' ? 'Claude wasn\'t allowed to read the numbers. Allow it in the page permissions to use this.' : 'Claude couldn\'t write the review. Try again.' }; }
  render();
}
// hover tooltips for both charts
function wireCharts() {
  const tip = document.getElementById('tip');
  const show = (txt, x, y) => { const [h, v] = txt.split('|'); tip.innerHTML = ''; const b = document.createElement('b'); b.textContent = v || h; const s = document.createElement('span'); s.textContent = v ? h : ''; tip.append(b, s); tip.hidden = false; tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, x + 14) + 'px'; tip.style.top = (y + 14) + 'px'; };
  document.querySelectorAll('[data-tip]').forEach(g => {
    g.addEventListener('pointermove', ev => show(g.dataset.tip, ev.clientX, ev.clientY));
    g.addEventListener('pointerleave', () => tip.hidden = true);
    g.addEventListener('focus', () => { const r = g.getBoundingClientRect(); show(g.dataset.tip, r.left, r.top); });
    g.addEventListener('blur', () => tip.hidden = true);
  });
  document.querySelectorAll('svg.line-chart').forEach(svg => {
    const pts = svg.dataset.pts.split(';').map(p => { const [x, d, v] = p.split(','); return { x: +x, d, v: +v }; });
    const hair = svg.querySelector('.xhair'), hit = svg.querySelector('.xhair-hit');
    hit.addEventListener('pointermove', ev => {
      const r = svg.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * 640;
      const p = pts.reduce((b, q) => Math.abs(q.x - vx) < Math.abs(b.x - vx) ? q : b);
      hair.setAttribute('x1', p.x); hair.setAttribute('x2', p.x); hair.setAttribute('opacity', '1');
      show(`${fmtDate(p.d)}|${p.v.toLocaleString('en')} views`, ev.clientX, ev.clientY);
    });
    hit.addEventListener('pointerleave', () => { hair.setAttribute('opacity', '0'); tip.hidden = true; });
  });
}

let route = '';
function render() {
  const id = (location.hash || '').slice(1);
  const an = id === 'analytics' || id.startsWith('analytics-') ? (acc(id.slice(10)) || acc('naija') || DATA.accounts[0]) : null;
  route = an ? 'analytics' : id === 'setup' || acc(id) ? id : 'today';
  const a = an || acc(route);
  document.documentElement.style.setProperty('--acc', a ? col(a) : '#f3efe6');
  document.getElementById('tabs').innerHTML = [['today', 'Today', '#f3efe6'], ['analytics', 'Analytics', '#1fa86a'], ...DATA.accounts.map(x => [x.id, x.short, col(x)]), ['setup', 'Setup', '#a29eac']]
    .map(([k, n, c]) => `<button class="tab" type="button" data-go="${k}" style="--acc:${c}" ${route === k ? 'aria-current="page"' : ''}><span class="led"></span>${esc(n)}</button>`).join('');
  document.getElementById('view').innerHTML = `<div style="display:grid;gap:22px;--acc:${a ? col(a) : '#f3efe6'}">${route === 'today' ? viewToday() : route === 'setup' ? viewSetup() : route === 'analytics' ? viewAnalytics(a) : viewChannel(a)}</div>`;

function paint() {
  document.querySelectorAll('.step').forEach(b => { b.disabled = !db || !canWrite; });
  document.querySelectorAll('.post').forEach(b => { const on = !!(posted[b.dataset.key] || {})[b.dataset.platform]; b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.disabled = !db || !canWrite; b.title = on ? 'Posted. Tap to undo.' : 'Tap after you post it'; });
  const d = today(), key = DAY_KEYS[d.getDay()];
  const due = DATA.accounts.filter(a => a.days.includes(key)).some(a => { const e = nextVideo(a); return !!e; });
  const t = document.getElementById('tally'); t.classList.toggle('clear', !due); document.getElementById('tallyText').textContent = due ? 'ON AIR · POSTS DUE' : 'ALL CLEAR';
  document.getElementById('clockDay').textContent = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  document.getElementById('clockWeek').textContent = `Week ${isoWeek(d)}`;

let toastTimer;
function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2200); }
function normLink(v, site) {
  v = (v || '').trim(); if (!v) return '';
  if (/^@?[A-Za-z0-9._-]{2,40}$/.test(v)) return site === 'tiktok' ? `https://www.tiktok.com/@${v.replace(/^@/, '')}` : `https://www.youtube.com/@${v.replace(/^@/, '')}`;
  if (/^https:\/\/([a-z0-9-]+\.)*(tiktok\.com|youtube\.com|youtu\.be)\//i.test(v)) return v;
  return null;
}

document.addEventListener('click', async ev => {
  const go = ev.target.closest('[data-go]');
  if (go) { ev.preventDefault(); location.hash = go.dataset.go; window.scrollTo({ top: 0 }); return; }
  const cp = ev.target.closest('[data-copytext]');
  if (cp) { try { await navigator.clipboard.writeText(cp.dataset.copytext); toast('Copied'); } catch { toast("Couldn't copy here. Press and hold the text instead."); } return; }
  const pl = ev.target.closest('[data-play]');
  if (pl) { const box = pl.closest('.thumb'); box.innerHTML = `<video controls playsinline autoplay src="${pl.dataset.play}"></video>`; return; }
  const exb = ev.target.closest('[data-examples]');
  if (exb) { examplesOff = exb.dataset.examples === 'off'; render(); return; }
  const askb = ev.target.closest('[data-ask]');
  if (askb) { askClaude(acc(askb.dataset.ask)); return; }
  const step = ev.target.closest('[data-step]');
  if (step) {
    if (!db || !canWrite) { toast('Sign in to claude.ai to save progress.'); return; }
    const [id, k] = step.dataset.step.split(':'), a = acc(id);
    if (step.dataset.auto && stepDone(a, k) && !((setup[id] || {}).done || {})[k]) { toast(k === 'links' ? 'Done automatically: links are saved.' : 'Done automatically: a video is marked posted.'); return; }
    const before = (setup[id] || {}).done || {}, done = { ...before, [k]: !before[k] };
    setup = { ...setup, [id]: { done } }; render();
    try { await db.collection('setup').doc(id).set({ done }); } catch { setup = { ...setup, [id]: { done: before } }; render(); toast("Couldn't save. Check your connection and tap again."); }
    return;
  }
  const post = ev.target.closest('.post');
  if (post && db && canWrite) {
    const k = post.dataset.key, p = post.dataset.platform, before = posted[k] || {};
    const next = { tiktok: !!before.tiktok, youtube: !!before.youtube, [p]: !before[p], updatedAt: new Date().toISOString() };
    posted = { ...posted, [k]: next }; render();
    try { await db.collection('posted').doc(k).set(next); if (next[p]) toast(`Marked posted on ${p === 'tiktok' ? 'TikTok' : 'YouTube'}`); }
    catch (e) { posted = { ...posted, [k]: before }; render(); toast("Couldn't save. Check your connection and tap again."); }
    return;
  }
  const save = ev.target.closest('.save');
  if (save) {
    const dl = await claude.use('downloads'); if (!dl) { save.hidden = true; return; }
    const label = save.textContent; save.disabled = true; save.textContent = 'Preparing…';
    try { const blob = await (await fetch(save.dataset.src)).blob(); await dl.save({ filename: save.dataset.file, data: blob }); save.textContent = 'Saved'; }
    catch (e) { toast(e && e.code === 'declined' ? 'Not saved' : e && e.code === 'rate_limited' ? 'Another save is open. Try again in a moment.' : "Couldn't save the video here."); save.textContent = label; }
    setTimeout(() => { save.textContent = label; save.disabled = false; }, 2000);
  }
});
document.addEventListener('change', async ev => {
  const el = ev.target;
  if (!el.dataset.vstatus && !el.dataset.vwhen && !el.dataset.import) return;
  if (!db || !canWrite) { toast('Sign in to claude.ai to save progress.'); return; }
  if (el.dataset.import) {
    const a = acc(el.dataset.import), file = el.files && el.files[0]; if (!file) return;
    toast('Importing…');
    try { const r = await importExport(a, file); toast(`Imported ${r.ok} video${r.ok === 1 ? '' : 's'}${r.missed.length ? `. ${r.missed.length} didn't match an episode` : ''}`); render(); }
    catch (e) { toast(e.message || "Couldn't read that file."); }
    el.value = ''; return;
  }
  const k = el.dataset.vstatus || el.dataset.vwhen, cur = vstats[k] || {};
  const next = el.dataset.vstatus ? { ...cur, status: el.value } : { ...cur, when: el.value };
  if (el.dataset.vstatus && el.value !== 'uploaded' && !next.when) { const a = acc(k.split('--')[0]), i = orderOf(a).findIndex(e => vkey(a, e) === k); next.when = isoDate(slotsFrom(a, i + 1)[i]); }
  vstats = { ...vstats, [k]: next }; render();
  try { await db.collection('vstats').doc(k).set(next); if (next.status === 'published') { const p = posted[k] || {}; if (!p.youtube) { const np = { tiktok: !!p.tiktok, youtube: true, updatedAt: new Date().toISOString() }; await db.collection('posted').doc(k).set(np); } } }
  catch { vstats = { ...vstats, [k]: cur }; render(); toast("Couldn't save. Check your connection and try again."); }
});
document.addEventListener('submit', async ev => {
  const f = ev.target; ev.preventDefault();
  if (!db || !canWrite) { toast('Sign in to claude.ai to save progress.'); return; }
  if (f.dataset.vmanual) {
    const a = acc(f.dataset.vmanual), e = a.episodes.find(x => x.id === f.elements.ep.value), k = vkey(a, e), cur = vstats[k] || {}, d = isoDate(today());
    const prev = (cur.history || []).slice(-1)[0] || {}, entry = { d };
    for (const fld of ['views', 'stayed', 'avgpct', 'likes', 'comments', 'subs']) { const raw = (f.elements[fld].value || '').replace(/[,%\s]/g, ''); if (raw === '') { if (prev[fld] != null) entry[fld] = prev[fld]; } else if (/^\d+(\.\d+)?$/.test(raw)) entry[fld] = Number(raw); else { toast('Numbers only, please.'); f.elements[fld].focus(); return; } }
    if (entry.views == null) { toast('Add the views at least.'); return; }
    const next = { ...cur, status: 'published', when: cur.when || d, history: (cur.history || []).filter(x => x.d !== d).concat([entry]).slice(-200) };
    try { await db.collection('vstats').doc(k).set(next); vstats = { ...vstats, [k]: next }; toast('Numbers saved'); render(); } catch { toast("Couldn't save. Check your connection and try again."); }
    return;
  }
  if (f.dataset.stats) {
    const id = f.dataset.stats, prev = latest(id) || {}, entry = { d: isoDate(today()) };
    for (const k of ['tf', 'tv', 'ys', 'yv']) { const raw = (f.elements[k].value || '').replace(/[,\s]/g, ''); if (raw === '') entry[k] = prev[k] ?? null; else if (/^\d+$/.test(raw)) entry[k] = Number(raw); else { toast('Numbers only, please, like 1250.'); f.elements[k].focus(); return; } }
    const hist = (((stats[id] && stats[id].history) || []).filter(e => e.d !== entry.d)).concat([entry]).slice(-400);
    try { await db.collection('stats').doc(id).set({ history: hist }); stats = { ...stats, [id]: { history: hist } }; toast('Numbers saved'); render(); }
    catch { toast("Couldn't save. Check your connection and try again."); }
  }
  if (f.dataset.links) {

    if (tt === null) { toast('Use a tiktok.com link or an @handle.'); return; }
    if (yt === null) { toast('Use a youtube.com link or an @handle.'); return; }
    try { await db.collection('links').doc(id).set({ tiktok: tt, youtube: yt }); links = { ...links, [id]: { tiktok: tt, youtube: yt } }; toast('Links saved'); render(); }
    catch { toast("Couldn't save. Check your connection and try again."); }

let downloadsOn = false;
render();
(async () => {
  const sync = document.getElementById('sync');
  if (!window.claude || !window.claude.use) { sync.textContent = 'Open this page on claude.ai to track posts and growth.'; sync.classList.add('warn'); return; }
  claude.use('downloads').then(dl => { if (dl) { downloadsOn = true; paint(); } });
  db = await claude.use('db');
  if (!db) { sync.textContent = 'Sign in to claude.ai to track posts and growth.'; sync.classList.add('warn'); paint(); return; }
  const user = await claude.use('user');
  if (user) { const w = await user.can('data.write'); if (w === false) canWrite = false; }
  let first = 5;
  const timer = setTimeout(() => { sync.textContent = "Can't reach your progress yet. Changes may not save until it loads."; sync.classList.add('warn'); }, 10000);
  const settle = snap => { if (!snap.metadata.fromCache && --first <= 0) { clearTimeout(timer); sync.classList.remove('warn'); sync.textContent = canWrite ? 'Progress syncs across your devices.' : 'View only: you can see progress but not change it.'; } };
  const sub = (name, apply) => db.collection(name).onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); }); apply(m); render(); settle(snap); }, () => { clearTimeout(timer); sync.textContent = 'Sync stopped. Reload the page to try again.'; sync.classList.add('warn'); });
  sub('posted', m => posted = m); sub('links', m => links = m); sub('stats', m => stats = m); sub('setup', m => setup = m); sub('vstats', m => vstats = m);
})();
