/* Layout: a civic newsroom in the videos' visual language. Sticky section nav, one view at a time, every number carries its source. */
:root{

  --fg:#eef8f1; --muted:#a3c4b0; --accent:#3dff9a; --accent-ink:#022313; --flag:#008751;
  --true:#3dff9a; --mis:#ffc83d; --false:#ff6a5c;
  --apc:#4aa3ff; --adc:#ff9d3a; --ndc:#3dff9a;
  --display:"Anton",Impact,"Arial Narrow",sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;text-transform:uppercase;margin:0;letter-spacing:.005em;text-wrap:balance;line-height:1}
h1{font-size:clamp(44px,9vw,92px)}
h2{font-size:clamp(30px,5vw,46px)}
h3{font-size:22px;letter-spacing:.01em}
p{margin:0;max-width:68ch}
a{color:var(--accent)}
.eyebrow{font:800 12px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mark{background:var(--accent);color:var(--accent-ink);padding:0 .12em;border-radius:.1em;display:inline-block;line-height:1.02}

/* nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(3,19,11,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;gap:8px;align-items:center;font:400 20px/1 var(--display);text-transform:uppercase;white-space:nowrap;color:var(--fg);text-decoration:none}
.flag{display:inline-flex;height:16px;border-radius:3px;overflow:hidden}
.flag i{width:9px;background:var(--flag)}.flag i:nth-child(2){background:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:8px 11px;border-radius:999px;color:var(--muted);text-decoration:none;font:800 13px/1 var(--body);white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

main{padding-block:28px 70px}
section.view{display:grid;gap:26px}
section.view[hidden]{display:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.stat .v{font:400 44px/1 var(--display);font-variant-numeric:tabular-nums}
.stat .k{font:800 11px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:800 14px var(--body);color:var(--fg);text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.clock{display:flex;gap:10px}
.clock div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:74px;text-align:center}
.clock b{display:block;font:400 46px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.clock span{font:800 10px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* candidates */
.cand-h{display:flex;gap:12px;align-items:center}
.av{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;font:400 24px/1 var(--display);border:3px solid var(--c);background:var(--panel2)}
.party{display:inline-block;font:900 11px/1 var(--body);letter-spacing:.08em;padding:5px 8px;border-radius:6px;background:var(--c);color:#021}
dl.facts{margin:0;display:grid;gap:8px}
dl.facts div{display:grid;gap:2px}
dl.facts dt{font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
dl.facts dd{margin:0}

/* compare */
.pickers{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.round{display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.round-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:620px){.vs{grid-template-columns:1fr}}
.side{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start;border-top:4px solid var(--c)}
.side .who{font:800 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font:800 13px var(--body)}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.verdict{display:grid;gap:10px;background:linear-gradient(135deg,rgba(61,255,154,.12),rgba(255,255,255,.02));border:1px solid rgba(61,255,154,.35);border-radius:16px;padding:18px}

/* fact checks */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font:800 13px var(--body)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.vd{display:inline-block;font:900 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:6px;border:2px solid currentColor}
.vd.true{color:var(--true)}.vd.mis{color:var(--mis)}.vd.false{color:var(--false)}
.claim{font:600 18px/1.4 var(--body)}
.claim::before{content:"“"}.claim::after{content:"”"}
.meta{font-size:13px;color:var(--muted)}

/* bars */
.bars{display:grid;gap:10px}
.bar{display:grid;gap:4px}
.bar .l{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:14px}
.bar .t{height:12px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:8px;background:var(--c,var(--accent))}
.diverge{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center}
.diverge .axis{position:relative;height:26px;background:linear-gradient(90deg,transparent calc(50% - 1px),var(--line) calc(50% - 1px),var(--line) calc(50% + 1px),transparent calc(50% + 1px))}
.diverge .axis i{position:absolute;top:4px;height:18px;border-radius:4px}

/* news */
.news{display:grid;gap:12px}
.item{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.item .when{font:400 18px/1.05 var(--display);text-transform:uppercase;color:var(--accent)}
.item h3{font:800 17px/1.3 var(--body);text-transform:none}
@media (max-width:520px){.item{grid-template-columns:1fr}}

/* match */
.q{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:11px 12px;font:600 15px var(--body)}
.opts button[aria-pressed="true"]{border-color:var(--accent);background:rgba(61,255,154,.12)}

/* ask */
.askbox{display:flex;gap:10px;flex-wrap:wrap}
.askbox input{flex:1 1 260px;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px}
.answer{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;white-space:pre-wrap}
.sugs{display:flex;gap:8px;flex-wrap:wrap}
.sugs button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:7px 12px;font:600 13px var(--body);color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:15px}
.tw{overflow-x:auto}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
footer{border-top:1px solid var(--line);padding-block:24px 40px;color:var(--muted);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:800;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

};

/* ======================= PIECES ======================= */
function factCard(x){ return `<div class="card"><div class="row" style="justify-content:space-between"><span class="meta">${esc(x.who)} · ${esc(x.when)}</span><span class="vd ${x.v}">${x.label}</span></div><div class="claim">${esc(x.claim)}</div><p class="muted">${esc(x.why)}</p><div class="src">${src(x.src)}</div></div>`; }
function newsItem(n){ return `<article class="item"><div class="when">${esc(n.when)}</div><div style="display:grid;gap:6px;min-width:0"><h3>${esc(n.h)}</h3><p class="muted">${esc(n.d)}</p><div class="src">${src(n.src)}</div></div></article>`; }
function barRow(r){ return `<div class="bar" style="--c:${r.c}"><div class="l"><span>${esc(r.n)}</span><span style="font-variant-numeric:tabular-nums">${r.v}%</span></div><div class="t"><i style="width:${r.v}%"></i></div></div>`; }
function viewerTable(v){ const cols = ['tinubu','atiku','obi','other']; return `<div class="tw"><table><thead><tr><th>Age</th>${cols.map(c => `<th>${c === 'other' ? 'Other' : cand(c).name}</th>`).join('')}<th>Votes</th></tr></thead><tbody>${Object.entries(v.ages).map(([age, r]) => { const t = cols.reduce((a, c) => a + (r[c] || 0), 0) || 1; return `<tr><td>${age}</td>${cols.map(c => `<td class="n">${Math.round((r[c] || 0) / t * 100)}%</td>`).join('')}<td class="n">${t}</td></tr>`; }).join('')}</tbody></table></div><div class="src">Updated ${esc(v.updated)} · ${v.total} responses · unscientific</div>`; }

function drawRounds(){
  const a = cand($('#ca').value), b = cand($('#cb').value);
  const picks = store.get('picks', {});
  const key = [a.id, b.id].sort().join('-');
  const mine = picks[key] || {};
  $('#rounds').innerHTML = a.id === b.id ? `<div class="card muted">Pick two different candidates.</div>` : ROUNDS.map(([k, l], i) => `
    <div class="round"><div class="round-h"><h3>Round ${i + 1} · ${l}</h3>
      <div class="pick" data-r="${k}">${[a, b].map(c => `<button data-w="${c.id}" aria-pressed="${mine[k] === c.id}">${c.name.split(' ')[1]} wins</button>`).join('')}<button data-w="tie" aria-pressed="${mine[k] === 'tie'}">Tie</button></div></div>
      <div class="vs">${[a, b].map(c => `<div class="side" style="--c:${c.c}"><div class="who">${c.name} · ${c.party}</div><div>${esc(c[k])}</div>${k === 'record' ? `<div class="muted small">${esc(c.reply)}</div><div class="src">${src(c.recSrc)}</div>` : k === 'pitch' ? `<div class="src">${src(c.pitchSrc)}</div>` : ''}</div>`).join('')}</div></div>`).join('');
  $('#rounds').onclick = e => { const btn = e.target.closest('[data-w]'); if (!btn) return; const r = btn.parentElement.dataset.r; const p = store.get('picks', {}); p[key] = p[key] || {}; p[key][r] = p[key][r] === btn.dataset.w ? undefined : btn.dataset.w; store.set('picks', p); drawRounds(); };
  const score = {[a.id]:0, [b.id]:0}; let n = 0; Object.values(mine).forEach(w => { if (!w) return; n++; if (score[w] !== undefined) score[w]++; });
  const lead = score[a.id] === score[b.id] ? null : (score[a.id] > score[b.id] ? a : b);
  const text = `My Naija Decides debate: ${a.name} ${score[a.id]} – ${score[b.id]} ${b.name}${lead ? `. ${lead.name} wins it for me.` : '.'} Judge for yourself: ${CONFIG.handle}`;
  $('#verdict').innerHTML = a.id === b.id ? '' : `<div class="eyebrow">Your verdict · ${n} of ${ROUNDS.length} rounds judged</div>
    <h2>${a.name.split(' ')[1]} ${score[a.id]} – ${score[b.id]} ${b.name.split(' ')[1]}</h2>
    <p class="muted">${n === 0 ? 'Judge the rounds above to see your result.' : lead ? `${lead.name} won more of your rounds. Your picks stay on this device.` : 'Level so far. Your picks stay on this device.'}</p>
    ${n ? `<button class="btn" id="sharev" style="justify-self:start">Copy my verdict</button>` : ''}`;
  const s = $('#sharev'); if (s) s.onclick = () => copy(text, 'Verdict copied. Paste it in your comments');
}

function drawMatch(){
  const ans = store.get('match', {}); const tot = {tinubu:0, atiku:0, obi:0}; let max = 0, n = 0;
  MATCH.forEach((m, i) => { const best = Math.max(...m.o.map(([, w]) => Math.max(0, ...Object.values(w)))); if (ans[i] === undefined) return; n++; max += best; Object.entries(m.o[ans[i]][1]).forEach(([c, w]) => tot[c] += w); });
  const rows = C.map(c => ({n:`${c.name} (${c.party})`, v: max ? Math.round(tot[c.id] / max * 100) : 0, c:c.c})).sort((x, y) => y.v - x.v);
  $('#mres').innerHTML = n ? `<div class="eyebrow">Your match · ${n} of ${MATCH.length} answered</div><div class="bars">${rows.map(barRow).join('')}</div>
    <p class="muted small">Based on stated pitches: ${C.map(c => src(c.pitchSrc)).join(' · ')}. Read the full records on Compare before you decide.</p>
    <div class="row"><button class="btn" id="mshare">Copy my result</button><button class="btn" id="mreset">Start again</button></div>`
    : `<div class="eyebrow">Your match</div><p class="muted">Answer the questions above to see how closely each candidate's pitch matches your views.</p>`;
  const sh = $('#mshare'); if (sh) sh.onclick = () => copy(`My Naija Decides match: ${rows.map(r => `${r.n.split(' (')[0]} ${r.v}%`).join(', ')}. Find yours: ${CONFIG.handle}`, 'Result copied');
  const rs = $('#mreset'); if (rs) rs.onclick = () => { store.set('match', {}); route(); };
}

/* ---------- Ask: verified-facts engine, upgraded to AI answers where available ---------- */
const STOP = new Set('the a an is are was were of to in on for and or what who how when did does do i me my about with be this that it at by from will can much many there'.split(' '));
const toks = s => s.toLowerCase().replace(/[^a-z0-9₦$%. ]/g, ' ').split(/\s+/).filter(w => w && !STOP.has(w)).map(w => w.replace(/s$/, ''));
function search(q){ const qt = toks(q); return KB.map(([qq, a, s]) => { const kt = new Set(toks(qq + ' ' + a)); const hit = qt.filter(t => kt.has(t)).length; const qhit = qt.filter(t => toks(qq).includes(t)).length; return {qq, a, s, score: hit + qhit * 1.5}; }).filter(r => r.score > 0).sort((x, y) => y.score - x.score); }
let sampleP = null;
async function ask(q){
  q = (q || '').trim(); if (!q) return;
  const box = document.createElement('div'); box.className = 'answer';
  $('#answers').prepend(box);
  const hits = search(q);
  const head = `<b>${esc(q)}</b>`;
  sampleP = sampleP || (window.claude ? window.claude.use('sample').catch(() => null) : Promise.resolve(null));
  const sample = await sampleP;
  if (sample) {
    box.innerHTML = head + '<div class="muted">Thinking…</div>';
    const facts = KB.map(([qq, a, s]) => `- ${qq} ${a} (Source: ${S[s].t}, ${S[s].u})`).join('\n');
    const prompt = `You answer questions for "Naija Decides", a neutral civic site about Nigeria's 16 January 2027 presidential election. Use ONLY the verified facts below. Be even-handed between candidates, never tell people who to vote for, say "alleged" for anything not decided by a court, and if the facts don't cover the question, say you don't have verified information on that yet. Answer in 2-4 short sentences in plain English, then a line "Source:" with the source name and link.\n\nVERIFIED FACTS (as of 4 Nov 2026):\n${facts}\n\nQUESTION: ${q}`;
    try {
      const out = await sample(prompt, { modelTier: 'quick', onText: ({text}) => { box.innerHTML = head + `<div>${esc(text)}</div>`; } });
      box.innerHTML = head + `<div>${esc(out.text)}</div><div class="src">AI answer from this site's verified facts.</div>`;
      return;
    } catch (e) { /* fall back to the facts engine */ }
  }
  if (!hits.length) { box.innerHTML = head + `<div>We don't have verified information on that yet. Try one of the suggested questions, or ask us on TikTok, Instagram or X and we may cover it in a video.</div>`; return; }
  const [top, ...more] = hits;
  box.innerHTML = head + `<div>${esc(top.a)}</div><div class="src">Source: ${src(top.s)}</div>` +
    (more.length ? `<div class="muted small" style="white-space:normal">Related: ${more.slice(0, 3).map(r => `<a href="#ask" data-rel="${esc(r.qq)}">${esc(r.qq)}</a>`).join(' · ')}</div>` : '');
  box.onclick = e => { const r = e.target.closest('[data-rel]'); if (r) { e.preventDefault(); $('#q').value = r.dataset.rel; ask(r.dataset.rel); } };
}

/* ======================= ROUTER ======================= */
const ORDER = ['home','compare','factchecks','promises','money','news','polls','match','ask'];
$('#tabs').innerHTML = ORDER.map(k => `<a href="#${k}" data-k="${k}">${VIEWS[k].label}</a>`).join('');
function route(){
  const k = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
  document.querySelectorAll('#tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.k === k ? 'page' : 'false'));
  $('#app').onclick = null;
  $('#app').innerHTML = `<section class="view">${VIEWS[k].render()}</section>`;
  VIEWS[k].after && VIEWS[k].after();
  const t = document.querySelector(`#tabs a[data-k="${k}"]`); t && t.scrollIntoView({block:'nearest', inline:'center'});
  tick();
}
function tick(){ const el = $('#clock'); if (!el) return; let s = Math.max(0, (ELECTION - new Date()) / 1000); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); const b = el.querySelectorAll('b'); b[0].textContent = d; b[1].textContent = h; b[2].textContent = m; }
setInterval(tick, 30000);
addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
route();
})();
</script>
