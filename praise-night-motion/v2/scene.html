<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Praise Night Motion</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #020617; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Praise Night with Pastor Ayo — animated 16:9 scene.
// Open directly (or as an OBS Browser Source) for a live, endless loop.
// URL options: ?mode=intermission  ?scale=2 (4K)  ?capture=1 (frame-by-frame rendering, used by render.mjs)
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'main';
const SCALE = parseFloat(Q.get('scale') || '1');
const CAPTURE = Q.has('capture');
const W = 1920, H = 1080;
const L = 30;                    // loop length in seconds — every motion is periodic in L
const BPM = 96;                  // 48 beats per loop
const TAU = Math.PI * 2;

const cv = document.getElementById('c');
cv.width = W * SCALE; cv.height = H * SCALE;
const ctx = cv.getContext('2d');

// ---------- helpers ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ph = (t, k = 1) => TAU * k * t / L;           // loop-safe phase
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const mod = (a, n) => ((a % n) + n) % n;
function canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
function beat(t) { const bl = 60 / BPM; return Math.exp(-mod(t, bl) / 0.16); }
function bar(t) { const bl = 4 * 60 / BPM; return Math.exp(-mod(t, bl) / 0.45); }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

function glowSprite(size, stops) {
  const c = canvas(size, size), g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
function goldGrad(g, y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0.00, '#fffbe6'); gr.addColorStop(0.22, '#ffe08a'); gr.addColorStop(0.45, '#e9a93a');
  gr.addColorStop(0.55, '#a8640f'); gr.addColorStop(0.70, '#f6c25a'); gr.addColorStop(0.88, '#ffe9a8'); gr.addColorStop(1, '#b4741c');
  return gr;
}

// ---------- assets ----------
const A = {};
async function setup() {
  await Promise.all([
    document.fonts.load('900 100px Cinzel', 'PRAISENIGHT'),
    document.fonts.load('700 30px Montserrat', 'CHRIST EMBASSY INTERMISSION'),
    document.fonts.load('800 30px Montserrat', 'INTERMISSION'),
    document.fonts.load('100px "Great Vibes"', 'with Pastor Ayo'),
    document.fonts.load('100px "Noto Music"', '\u{1D11E}'),
  ]);
  const [pastor, flyer, ...cards] = await Promise.all(['pastor.png', 'flyer.jpg', 'card1.jpg', 'card2.jpg', 'card3.jpg', 'card4.jpg'].map(f => loadImg('assets/' + f)));
  A.pastor = pastor; A.cards = cards;

  // Blurred stage/crowd atmosphere from the flyer.
  A.atmos = canvas(W, H);
  { const g = A.atmos.getContext('2d'); g.filter = 'blur(14px) saturate(1.3)'; g.drawImage(flyer, -60, -40, W + 120, H + 80); }

  // Horizontally tileable haze.
  A.haze = canvas(1920, 1080);
  { const g = A.haze.getContext('2d'), r = rng(11); g.filter = 'blur(60px)';
    for (let i = 0; i < 70; i++) { const x = r() * 1920, y = 300 + r() * 780, s = 120 + r() * 260, a = 0.05 + r() * 0.08;
      const col = r() < 0.7 ? `rgba(70,110,255,${a})` : `rgba(255,170,80,${a * 0.8})`;
      for (const dx of [-1920, 0, 1920]) { g.fillStyle = col; g.beginPath(); g.ellipse(x + dx, y, s * 1.8, s * 0.6, 0, 0, TAU); g.fill(); } } }

  A.flag = makeFlag();
  A.flagLayer = canvas(1100, 620);
  A.glowGold = glowSprite(256, [[0, 'rgba(255,236,180,1)'], [0.15, 'rgba(255,200,90,0.55)'], [0.45, 'rgba(255,150,40,0.12)'], [1, 'rgba(255,140,30,0)']]);
  A.glowBlue = glowSprite(256, [[0, 'rgba(160,200,255,0.9)'], [0.2, 'rgba(70,120,255,0.4)'], [1, 'rgba(40,80,255,0)']]);
  A.dot = glowSprite(32, [[0, 'rgba(255,245,215,1)'], [0.3, 'rgba(255,205,110,0.7)'], [1, 'rgba(255,180,60,0)']]);
  A.streak = (() => { const c = canvas(1024, 64), g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 1024, 0); gr.addColorStop(0, 'rgba(255,190,90,0)'); gr.addColorStop(0.5, 'rgba(255,240,210,1)'); gr.addColorStop(1, 'rgba(255,190,90,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 1024, 64);
    g.globalCompositeOperation = 'destination-in';
    const v = g.createLinearGradient(0, 0, 0, 64); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(0.5, 'rgba(0,0,0,1)'); v.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = v; g.fillRect(0, 0, 1024, 64); return c; })();

  buildTitle();
  buildText();
  buildGlobe();
  buildParticles();
  A.tmp = canvas(W, H);
}

function makeFlag() {
  // Flag of Canada, 2:1
  const c = canvas(960, 480), g = c.getContext('2d');
  g.fillStyle = '#e8102a'; g.fillRect(0, 0, 960, 480);
  g.fillStyle = '#fff'; g.fillRect(240, 0, 480, 480);
  g.save(); g.translate(0, 0); g.scale(0.1, 0.1); g.fillStyle = '#e8102a';
  g.fill(new Path2D('m4890 4430-45-863a95 95 0 0 1 111-98l859 151-116-320a65 65 0 0 1 20-73l941-762-212-99a65 65 0 0 1-34-79l186-572-542 115a65 65 0 0 1-73-38l-105-247-423 454a65 65 0 0 1-111-57l204-1052-327 189a65 65 0 0 1-91-27l-332-652-332 652a65 65 0 0 1-91 27l-327-189 204 1052a65 65 0 0 1-111 57l-423-454-105 247a65 65 0 0 1-73 38l-542-115 186 572a65 65 0 0 1-34 79l-212 99 941 762a65 65 0 0 1 20 73l-116 320 859-151a95 95 0 0 1 111 98l-45 863z'));
  g.restore(); return c;
}

// ---------- title ----------
const TITLE_SIZE = 158;
function glyphSprite(ch, font, size, opts = {}) {
  const m = canvas(10, 10).getContext('2d'); m.font = font;
  const w = m.measureText(ch).width, pad = 40, hh = size * 1.7;
  const c = canvas(w + pad * 2, hh + pad * 2), g = c.getContext('2d');
  g.font = font; g.textBaseline = 'alphabetic';
  const bx = pad, by = pad + size * 1.12 + (opts.dy || 0);
  const top = by - size * 0.78, bot = by + (opts.bottom || 0.02) * size;
  g.lineJoin = 'round';
  g.strokeStyle = '#2b1300'; g.lineWidth = opts.stroke || 12; g.strokeText(ch, bx, by + 3);
  g.strokeStyle = '#6b3a06'; g.lineWidth = (opts.stroke || 12) * 0.5; g.strokeText(ch, bx, by);
  g.fillStyle = goldGrad(g, top, bot); g.fillText(ch, bx, by);
  // bevel: light from top-left
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = 'rgba(255,255,240,0.55)'; g.fillText(ch, bx - 2, by - 3);
  g.fillStyle = goldGrad(g, top, bot); g.fillText(ch, bx + 1, by + 1);
  g.globalCompositeOperation = 'source-over';
  g.strokeStyle = 'rgba(255,250,220,0.65)'; g.lineWidth = 1.4; g.strokeText(ch, bx, by);
  // glow + shadow versions
  const glow = canvas(c.width, c.height), gg = glow.getContext('2d'); gg.filter = 'blur(16px)'; gg.drawImage(c, 0, 0);
  const sh = canvas(c.width, c.height), sg = sh.getContext('2d'); sg.filter = 'blur(10px) brightness(0)'; sg.globalAlpha = 0.75; sg.drawImage(c, 0, 0);
  return { c, glow, sh, w, pad, by };
}
function buildTitle() {
  const font = `900 ${TITLE_SIZE}px Cinzel`;
  const clefFont = `${TITLE_SIZE * 1.18}px "Noto Music"`;
  const mk = (word) => [...word].map(ch => ch === 'I' && word === 'PRAISE'
    ? Object.assign(glyphSprite('\u{1D11E}', clefFont, TITLE_SIZE * 1.18, { stroke: 9, dy: 18, bottom: 0.35 }), { clef: true })
    : glyphSprite(ch, font, TITLE_SIZE));
  A.title = [mk('PRAISE'), mk('NIGHT')];
  for (const line of A.title) {
    const kern = -6;
    line.width = line.reduce((s, g) => s + g.w + kern, -kern);
    let x = -line.width / 2;
    for (const g of line) { g.x = x; x += g.w + kern; }
  }
  A.titleLayer = canvas(W, H);
}

function scriptSprite(text, size, stroke = 6) {
  const font = `${size}px "Great Vibes"`;
  const m = canvas(10, 10).getContext('2d'); m.font = font;
  const w = m.measureText(text).width, pad = 50;
  const c = canvas(w + pad * 2, size * 1.6 + pad * 2), g = c.getContext('2d');
  g.font = font; const by = pad + size * 1.05;
  g.lineJoin = 'round'; g.strokeStyle = '#3a1d02'; g.lineWidth = stroke; g.strokeText(text, pad, by + 2);
  g.fillStyle = goldGrad(g, by - size * 0.8, by + size * 0.25); g.fillText(text, pad, by);
  const glow = canvas(c.width, c.height), gg = glow.getContext('2d'); gg.filter = 'blur(12px)'; gg.drawImage(c, 0, 0);
  return { c, glow, w, pad };
}
function spacedSprite(text, font, spacing, fill, glowCol) {
  const m = canvas(10, 10).getContext('2d'); m.font = font; m.letterSpacing = spacing + 'px';
  const w = m.measureText(text).width, pad = 30;
  const c = canvas(w + pad * 2, 120), g = c.getContext('2d');
  g.font = font; g.letterSpacing = spacing + 'px'; g.textBaseline = 'middle';
  if (glowCol) { g.shadowColor = glowCol; g.shadowBlur = 18; }
  g.fillStyle = fill(g); g.fillText(text, pad, 60);
  return { c, w, pad };
}
function buildText() {
  A.header = spacedSprite('CHRIST EMBASSY REGINA GROUP CHURCH', '700 30px Montserrat', 9, () => '#ffffff', 'rgba(120,160,255,0.8)');
  A.with = scriptSprite('with', 64, 4);
  A.ayo = scriptSprite('Pastor Ayo', 120, 6);
  A.inter = spacedSprite('INTERMISSION', '800 40px Montserrat', 16, g => goldGrad(g, 40, 80), 'rgba(255,170,60,0.9)');
}

// ---------- globe ----------
const GLOBE = { cx: 960, cy: 1690, R: 960, tilt: 0.42 };
function buildGlobe() {
  const r = rng(5);
  A.gdots = [];
  for (let i = 0; i < 520; i++) {
    const z = r() * 2 - 1, lon = r() * TAU, lat = Math.asin(z);
    if (lat < -0.2) continue;
    A.gdots.push({ lat, lon, s: 0.4 + r() * 1.1, tw: 1 + Math.floor(r() * 5), p: r() * TAU });
  }
  A.garcs = [];
  for (let i = 0; i < 90; i++) {
    const a = A.gdots[Math.floor(r() * A.gdots.length)];
    let best = null, bd = 9;
    for (let k = 0; k < 25; k++) { const b = A.gdots[Math.floor(r() * A.gdots.length)]; const d = angDist(a, b); if (d > 0.12 && d < bd && d < 0.45) { bd = d; best = b; } }
    if (best) A.garcs.push({ a, b: best, speed: 1 + Math.floor(r() * 3), p: r() });
  }
}
function angDist(a, b) { return Math.acos(clamp(Math.sin(a.lat) * Math.sin(b.lat) + Math.cos(a.lat) * Math.cos(b.lat) * Math.cos(a.lon - b.lon), -1, 1)); }
function sph(lat, lon, rot) {
  const l = lon + rot;
  const x = Math.cos(lat) * Math.sin(l), y = Math.sin(lat), z = Math.cos(lat) * Math.cos(l);
  const ct = Math.cos(GLOBE.tilt), st = Math.sin(GLOBE.tilt);
  const y2 = y * ct + z * st, z2 = -y * st + z * ct;
  return { X: GLOBE.cx + GLOBE.R * x, Y: GLOBE.cy - GLOBE.R * y2, z: z2 };
}

// ---------- particles ----------
function buildParticles() {
  const r = rng(21);
  A.sparks = Array.from({ length: 160 }, () => ({ x: r() * W, y: r() * H, k: 1 + Math.floor(r() * 3), s: 0.25 + r() * 0.9, sw: 5 + r() * 25, swk: 1 + Math.floor(r() * 3), p: r() * TAU, tw: 2 + Math.floor(r() * 6), b: 0.3 + r() * 0.7 }));
  A.bokeh = Array.from({ length: 26 }, () => ({ x: r() * W, y: r() * H, k: 1, s: 0.5 + r() * 1.4, p: r() * TAU, gold: r() < 0.55, dx: (r() < 0.5 ? -1 : 1) }));
  const glyphs = ['♪', '♫', '♬', '♩', '\u{1D11E}'];
  A.notes = Array.from({ length: 22 }, (_, i) => ({ g: glyphs[i % glyphs.length], x: 80 + r() * (W - 160), y: r(), k: 1 + Math.floor(r() * 2), s: 26 + r() * 34, sw: 20 + r() * 40, p: r() * TAU, rot: (r() - 0.5) * 0.8 }));
  A.noteSprites = {};
  for (const g of glyphs) {
    const c = canvas(140, 160), x = c.getContext('2d');
    x.font = `90px "Noto Music", "DejaVu Sans", serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.shadowColor = 'rgba(255,170,50,0.95)'; x.shadowBlur = 22; x.fillStyle = goldGrad(x, 40, 120); x.fillText(g, 70, 82);
    x.shadowBlur = 0; x.fillText(g, 70, 82);
    A.noteSprites[g] = c;
  }
}

// =================== FRAME ===================
function drawBackground(t) {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#02051a'); bg.addColorStop(0.45, '#061348'); bg.addColorStop(0.75, '#081c6a'); bg.addColorStop(1, '#020720');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // stage/crowd atmosphere drifting
  ctx.save();
  ctx.globalAlpha = 0.2;
  const sx = 30 * Math.sin(ph(t)), sc = 1.06 + 0.03 * Math.sin(ph(t, 2));
  ctx.translate(W / 2 + sx, H / 2); ctx.scale(sc, sc); ctx.drawImage(A.atmos, -W / 2, -H / 2);
  ctx.restore();

  // warm stage glow upper-right, cool upper-left
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.22 + 0.1 * Math.sin(ph(t, 3));
  ctx.drawImage(A.glowGold, 1250, -350, 1100, 1100);
  ctx.globalAlpha = 0.18 + 0.08 * Math.sin(ph(t, 2) + 1);
  ctx.drawImage(A.glowBlue, 250, -300, 1400, 1100);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function drawFlag(t) {
  // Waving flag, upper left, feathered into the scene
  const f = A.flag, fl = A.flagLayer, g = fl.getContext('2d');
  const w = 1240, h = 620, ox = -200, oy = -120, strips = 110, sw = w / strips;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, fl.width, fl.height);
  for (let i = 0; i < strips; i++) {
    const u = i / strips;
    const wave = Math.sin(u * 7 - ph(t, 4)) * (8 + 24 * u) + Math.sin(u * 13 - ph(t, 7)) * 5 * u;
    const slope = Math.cos(u * 7 - ph(t, 4));
    const x = ox + Math.floor(i * sw);
    g.drawImage(f, u * f.width, 0, f.width / strips, f.height, x, oy + wave, Math.ceil(sw) + 1, h);
    g.fillStyle = slope > 0 ? `rgba(255,255,255,${slope * 0.12})` : `rgba(0,0,30,${-slope * 0.3})`;
    g.fillRect(x, oy + wave, Math.ceil(sw) + 1, h);
  }
  g.globalCompositeOperation = 'destination-in';
  g.save(); g.scale(1, 0.68);
  const m = g.createRadialGradient(380, 250, 30, 380, 250, 400);
  m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(0.5, 'rgba(0,0,0,0.65)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = m; g.fillRect(0, 0, fl.width, fl.height / 0.68); g.restore();
  ctx.globalAlpha = 0.42; ctx.drawImage(fl, 0, 0); ctx.globalAlpha = 1;
}

function drawHaze(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [k, a, dir] of [[1, 0.45, 1], [2, 0.3, -1]]) {
    const off = mod(dir * t / L * W * k, W);
    ctx.globalAlpha = a;
    ctx.drawImage(A.haze, off - W, 0); ctx.drawImage(A.haze, off, 0);
  }
  ctx.restore();
}

const BEAMS = [
  { x: 140, a0: 0.45, amp: 0.30, k: 1, col: [80, 120, 255] },
  { x: 470, a0: 0.18, amp: 0.38, k: 2, col: [170, 90, 255] },
  { x: 780, a0: 0.05, amp: 0.30, k: 1, col: [255, 190, 90] },
  { x: 1140, a0: -0.05, amp: 0.30, k: 1, col: [255, 190, 90] },
  { x: 1450, a0: -0.18, amp: 0.38, k: 2, col: [170, 90, 255] },
  { x: 1780, a0: -0.45, amp: 0.30, k: 1, col: [80, 120, 255] },
];
function drawBeams(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const b = beat(t);
  BEAMS.forEach((B, i) => {
    const a = B.a0 + B.amp * Math.sin(ph(t, B.k) + i * 1.3) * (i < 3 ? 1 : -1);
    const len = 1400, spread = 0.085;
    const ox = B.x, oy = -60;
    const inten = 0.09 + 0.06 * Math.sin(ph(t, 3) + i) + 0.06 * b;
    for (const [sp, al] of [[spread, inten], [spread * 0.35, inten * 1.4]]) {
      const gr = ctx.createLinearGradient(ox, oy, ox + Math.sin(a) * len, oy + Math.cos(a) * len);
      gr.addColorStop(0, `rgba(${B.col},${al})`); gr.addColorStop(0.6, `rgba(${B.col},${al * 0.35})`); gr.addColorStop(1, `rgba(${B.col},0)`);
      ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(ox, oy);
      ctx.lineTo(ox + Math.sin(a - sp) * len, oy + Math.cos(a - sp) * len);
      ctx.lineTo(ox + Math.sin(a + sp) * len, oy + Math.cos(a + sp) * len); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 0.6 + 0.4 * b; ctx.drawImage(A.glowGold, ox - 70, oy - 10, 140, 140); ctx.globalAlpha = 1;
  });
  ctx.restore();
}

function drawRays(t) {
  // rotating god-rays from behind the globe horizon (24 rays => 15° periodic)
  const cx = 960, cy = 760, n = 24;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const rot = (TAU / n) * (t / L);
  for (let i = 0; i < n; i++) {
    const a = rot + i * TAU / n;
    if (Math.sin(a) > 0.2) continue;             // only rays pointing upward
    const w = 0.035 + 0.02 * Math.sin(i * 2.3), len = 1100;
    const al = (0.025 + 0.02 * Math.sin(ph(t, 2) + i * 1.7)) * (1 + 0.6 * bar(t));
    const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, len);
    gr.addColorStop(0, `rgba(255,220,150,${al * 2})`); gr.addColorStop(0.4, `rgba(120,160,255,${al})`); gr.addColorStop(1, 'rgba(80,120,255,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, len, a - w, a + w); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ---------- cards ----------
const SLOTS = [
  { x: 300, y: 395, w: 230, h: 340, skew: 0.07, rot: -0.05 },
  { x: 575, y: 360, w: 250, h: 370, skew: 0.04, rot: -0.025 },
  { x: 1345, y: 360, w: 250, h: 370, skew: -0.04, rot: 0.025 },
  { x: 1620, y: 395, w: 230, h: 340, skew: -0.07, rot: 0.05 },
];
function drawCards(t) {
  const step = L / 4, flipDur = 0.9;
  SLOTS.forEach((S, s) => {
    const tt = mod(t - s * 0.18, L), k = Math.floor(tt / step), within = tt - k * step;
    const fp = clamp((within - (step - flipDur)) / flipDur);
    const flipping = fp > 0 && fp < 1;
    const idx = (s + k + (fp >= 0.5 ? 1 : 0)) % 4;
    const sxF = flipping ? Math.max(0.02, Math.abs(Math.cos(Math.PI * smooth(fp)))) : 1;
    const fy = 12 * Math.sin(ph(t, 2) + s * 1.6), fr = 0.012 * Math.sin(ph(t, 1) + s);
    const img = A.cards[idx];
    ctx.save();
    ctx.translate(S.x, S.y + fy);
    ctx.rotate(S.rot + fr);
    ctx.transform(sxF, S.skew * sxF, 0, 1, 0, 0);
    const w = S.w, h = S.h;
    // glow
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.18 + 0.15 * beat(t);
    ctx.drawImage(A.glowBlue, -w * 0.9, -h * 0.75, w * 1.8, h * 1.5);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    // shadow
    ctx.shadowColor = 'rgba(0,0,20,0.7)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 14;
    rr(ctx, -w / 2, -h / 2, w, h, 18); ctx.fillStyle = '#0a1440'; ctx.fill();
    ctx.shadowColor = 'transparent';
    // photo (cover-fit, top-anchored)
    ctx.save(); rr(ctx, -w / 2, -h / 2, w, h, 18); ctx.clip();
    const sc = Math.max(w / img.width, h / img.height);

function drawGlobe(t) {

      const P = sph(lat, j / 96 * TAU, 0);

    }

    const vb = [Math.cos(arc.b.lat) * Math.cos(arc.b.lon), Math.cos(arc.b.lat) * Math.sin(arc.b.lon), Math.sin(arc.b.lat)];
    for (let j = 0; j <= 10; j++) {

    const u = mod(t / L * arc.speed * 3 + arc.p, 1), j = Math.min(9, Math.floor(u * 10)), f = u * 10 - j;

    const tw = 0.55 + 0.45 * Math.sin(ph(t, d.tw) + d.p);

  ctx.restore();

}

function flare(x, y, s) {

// ---------- gold ribbons ----------
const RIBBONS = [
  { p: [[-80, 560], [520, 800], [1400, 800], [2000, 560]], w: 3.5, k: 2 },
  { p: [[-80, 640], [560, 930], [1360, 930], [2000, 640]], w: 2.2, k: 3 },
  { p: [[-80, 860], [600, 1000], [1320, 1000], [2000, 860]], w: 2.8, k: 2 },
];
function bez(p, u) {
  const v = 1 - u;
  return [v * v * v * p[0][0] + 3 * v * v * u * p[1][0] + 3 * v * u * u * p[2][0] + u * u * u * p[3][0],
          v * v * v * p[0][1] + 3 * v * v * u * p[1][1] + 3 * v * u * u * p[2][1] + u * u * u * p[3][1]];
}
function drawRibbons(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  RIBBONS.forEach((Rb, i) => {
    const wob = 18 * Math.sin(ph(t, 1) + i * 2);
    const p = Rb.p.map((q, j) => [q[0], q[1] + (j === 1 || j === 2 ? wob * (j === 1 ? 1 : -1) : 0)]);
    const path = new Path2D(); path.moveTo(...p[0]); path.bezierCurveTo(...p[1], ...p[2], ...p[3]);
    const gr = ctx.createLinearGradient(0, 0, W, 0);
    gr.addColorStop(0, 'rgba(255,170,60,0.0)'); gr.addColorStop(0.2, 'rgba(255,200,110,0.8)'); gr.addColorStop(0.5, 'rgba(255,240,200,0.45)');
    gr.addColorStop(0.8, 'rgba(255,200,110,0.8)'); gr.addColorStop(1, 'rgba(255,170,60,0.0)');
    ctx.strokeStyle = 'rgba(255,170,60,0.12)'; ctx.lineWidth = Rb.w * 7; ctx.stroke(path);
    ctx.strokeStyle = gr; ctx.lineWidth = Rb.w; ctx.stroke(path);
    // comets
    for (let c = 0; c < Rb.k; c++) {
      const dir = (i + c) % 2 ? 1 : -1;
      const u0 = mod(dir * t / L * 2 + c / Rb.k + i * 0.13, 1);
      for (let tr = 0; tr < 14; tr++) {

    }
  });
  ctx.restore();
}

// ---------- title & text ----------
function drawTitle(t) {
  const b = bar(t), bt = beat(t);

  const L2 = A.titleLayer, g = L2.getContext('2d');

    const n = li * 6 + i;
    const dy = 7 * Math.sin(ph(t, 2) - n * 0.55);
    const x = 960 + (s.x - s.pad) * scale, y = ln.y - s.by * scale + dy - (s.clef ? 12 : 0);
    items.push({ s, x, y, n });
  }));

  ctx.save(); ctx.globalCompositeOperation = 'lighter';

  const sp = mod(t / (L / 3), 1);                 // shine sweep 3x per loop

    g.globalCompositeOperation = 'source-atop';
    const gr = g.createLinearGradient(x - 160, 520, x + 160, 900);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.45, 'rgba(255,255,235,0.0)'); gr.addColorStop(0.5, 'rgba(255,255,240,0.85)'); gr.addColorStop(0.55, 'rgba(255,255,235,0)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'source-over';
  }

  // sparkle glints on letter tips

}
function flareSmall(x, y, s) {

function scriptAlpha(t) {

}

function drawHeader(t) {

function drawEqualizer(t) {

    const m = Math.abs(i - (n - 1) / 2) / (n / 2);     // 0 centre .. 1 edges

function drawVignette() {

function renderAt(t) {

  drawHeader(t);
  drawSparks(t);
  if (MODE === 'intermission') drawIntermission(t);
  drawVignette();
}

window.LOOP_SECONDS = L;
window.renderAt = renderAt;
window.ready = setup().then(() => {
  if (!CAPTURE) {
    const t0 = performance.now();
    const tick = () => { renderAt((performance.now() - t0) / 1000); requestAnimationFrame(tick); };
    tick();
  }
  return true;
});
</script>
</body>
</html>
